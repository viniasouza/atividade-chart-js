<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Chart JS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="display: flex">


    <div style="position: relative; height:40vh; width:60vw">
        <canvas id="graficoLinhas"></canvas>
    </div>

    <div style="position: relative; height:40vh; width:60vw">
        <canvas id="graficoBarras"></canvas>
    </div>

</body>

</html>
<script>


    // Constantes eixo X
    const labelMeses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'];
    const labelHorario = ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'];


    // Plota grafico de linhas
    const ctx = document.getElementById('graficoLinhas');

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labelHorario,
            datasets: [{
                label: 'Temperatura',
                backgroundColor: 'rgb(255,99,132)',
                borderColor: 'rgb(255,99,132)',
                data: [30, 29, 28, 25, 22, 23],
                borderWidth: 3
            }, {
                label: 'Umidade',
                backgroundColor: 'rgb(0,0,255)',
                borderColor: 'rgb(0,0,255)',
                data: [80, 82, 80, 85, 80, 83],
                borderWidth: 3
            }]
        },

        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    // Plota o grafico de barras
    const ctxBarras = document.getElementById('graficoBarras');

    new Chart(ctxBarras, {
        type: 'bar',
        data: {
            labels: labelMeses,
            datasets: [{
                label: 'Temperatura Média',
                backgroundColor: 'rgb(255,99,132)',
                borderColor: 'rgb(255,99,132)',
                data: [22, 24, 27, 23, 20, 18],
                borderWidth: 3
            }, {
                label: 'Umidade Média',
                backgroundColor: 'rgb(0,0,255)',
                borderColor: 'rgb(0,0,255)',
                data: [90, 89, 93, 87, 88, 82],
                borderWidth: 3
            }]
        },

        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

</script>
